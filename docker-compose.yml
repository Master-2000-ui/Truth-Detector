services:
  auditor:
    build:
      context: .
    image: local-password-auditor:latest
    read_only: true
    network_mode: none
    init: true
    restart: "no"
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - ./passwords.txt:/data/passwords.txt:ro
      - ./reports:/reports
    command: ["/data/passwords.txt", "--format", "json", "--output", "/reports/audit.json"]

  auditor-via-gateway:
    profiles: ["gateway"]
    extends:
      service: auditor
    network_mode: "service:gateway"
    depends_on:
      - gateway

  gateway:
    profiles: ["gateway"]
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        echo 'Configure this service with an approved proxy or VPN client; refusing to forward traffic by default.';
        sleep infinity
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
